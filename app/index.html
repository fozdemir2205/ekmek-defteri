<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dağıtım Günlüğü</title>
<meta name="description" content="Ekmek dağıtımcısı için mesai, teslimat, iade ve nakit takibi.">
<meta name="theme-color" content="#F5F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15110D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: tek sütun telefon ekranı; büyük eylem butonu alt kenara sabit, liste satırları başparmak boyunda */
:root{
  --bg:#F5F3EE; --surface:#FFFFFF; --sunk:#EFEBE4; --ink:#21170D; --muted:#6A5E50; --line:#E2DBD0;
  --wheat:#D8971A; --wheat-ink:#241500; --wheat-soft:#FBEED2;
  --ok:#1D7546; --ok-soft:#E0F1E6; --warn:#A8460C; --warn-soft:#FCE9DA; --off:#6F675D; --off-soft:#ECE8E2;
  --wa:#178A4A; --wa-ink:#FFFFFF; --scrim:rgba(20,14,8,.5); --toast-bg:#21170D; --toast-fg:#FBF6EE;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15110D; --surface:#201A14; --sunk:#2A231C; --ink:#F3ECE1; --muted:#B4A794; --line:#3A3127;
  --wheat:#E8AD3B; --wheat-ink:#1D1200; --wheat-soft:#3A2B10;
  --ok:#55C68A; --ok-soft:#163023; --warn:#F2955A; --warn-soft:#3A2113; --off:#A99F92; --off-soft:#2D261F;
  --wa:#2CB567; --wa-ink:#06130B; --scrim:rgba(0,0,0,.6); --toast-bg:#F3ECE1; --toast-fg:#15110D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15110D; --surface:#201A14; --sunk:#2A231C; --ink:#F3ECE1; --muted:#B4A794; --line:#3A3127;
  --wheat:#E8AD3B; --wheat-ink:#1D1200; --wheat-soft:#3A2B10;
  --ok:#55C68A; --ok-soft:#163023; --warn:#F2955A; --warn-soft:#3A2113; --off:#A99F92; --off-soft:#2D261F;
  --wa:#2CB567; --wa-ink:#06130B; --scrim:rgba(0,0,0,.6); --toast-bg:#F3ECE1; --toast-fg:#15110D; color-scheme:dark}

*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
html,body{overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:11px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--wheat);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 140px}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.brand{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.01em;line-height:1;display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.top-sub{font-size:11px;color:var(--muted);margin-top:2px}
.tbtns{display:flex;gap:8px}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:12px;font-weight:600;min-height:44px}
.back{background:none;border:0;padding:8px 0;font-size:12px;font-weight:600;color:var(--muted);min-height:44px}

.banner{background:var(--wheat-soft);border-radius:var(--r);padding:10px 14px;font-size:12px;display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.banner button{background:none;border:0;font-weight:700;text-decoration:underline;font-size:12px;padding:6px 0;white-space:nowrap}
.alert{background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;font-size:12px;margin-bottom:14px;display:grid;gap:10px}
.alert b{color:var(--warn)}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 16px;display:grid;gap:6px;margin-bottom:18px}
.hero h1{font-family:var(--f-display);font-size:32px;line-height:1.05;margin:0;text-wrap:balance}
.hero p{margin:0;color:var(--muted);font-size:12px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:2px;text-align:left;min-width:0}
.stat small{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.stat b{font-family:var(--f-display);font-size:24px;line-height:1.05;font-variant-numeric:tabular-nums}
button.stat{cursor:pointer}
button.stat b::after{content:" ✎";font-size:12px;color:var(--muted);font-family:var(--f-body)}

.truck{background:var(--sunk);border-radius:var(--r);padding:12px 14px;margin-bottom:16px;display:flex;gap:12px;align-items:center;justify-content:space-between;font-size:12px}
.truck b{font-variant-numeric:tabular-nums}
.link{background:none;border:0;color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:8px 0;font-size:12px;white-space:nowrap;min-height:44px}

.sec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:22px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;font-size:13px}

.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.crow{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;width:100%;min-height:60px;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;border-left:5px solid transparent}
.crow:last-child{border-bottom:0}
.crow .ix{font-family:var(--f-display);font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.crow .nm{font-weight:600;font-size:13px;line-height:1.25;min-width:0}
.crow .sub{display:block;font-weight:400;font-size:11px;color:var(--muted);margin-top:2px}
.crow.s-teslim{border-left-color:var(--ok);background:color-mix(in srgb,var(--ok-soft) 55%,transparent)}
.crow.s-kapali{border-left-color:var(--off)}
.crow.s-ugranmadi{border-left-color:var(--warn)}
.chip{font-size:10px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap}
.c-bekliyor{border:1.5px solid var(--line);color:var(--muted)}
.c-teslim{background:var(--ok-soft);color:var(--ok)}
.c-kapali{background:var(--off-soft);color:var(--off)}
.c-ugranmadi{background:var(--warn-soft);color:var(--warn)}
.c-sent{background:var(--ok-soft);color:var(--ok)}
.c-unsent{background:var(--wheat-soft);color:var(--ink)}
.cash-dot{color:var(--wheat);font-weight:700}

.row-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn{border-radius:var(--r);border:1px solid var(--line);background:var(--surface);padding:10px 14px;font-weight:600;font-size:13px;min-height:48px}
.btn.wide{flex:1 1 140px}
.btn.danger{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border:0;border-radius:16px;background:var(--wheat);color:var(--wheat-ink);font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.01em;text-decoration:none}
.big.dark{background:var(--ink);color:var(--bg)}
.big.wa{background:var(--wa);color:var(--wa-ink)}
.big small{font-family:var(--f-body);font-size:12px;font-weight:600;opacity:.85}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar>div{max-width:488px;margin:0 auto}

.empty{padding:20px 16px;color:var(--muted);font-size:12px;text-align:center}
.hist{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;width:100%;padding:14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left}
.hist:last-child{border-bottom:0}
.hist b{font-size:13px}
.hist span{font-size:11px;color:var(--muted)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.tile small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tile b{font-family:var(--f-display);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile p{margin:2px 0 0;font-size:11px;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:4px;margin-bottom:10px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px;font-weight:600;font-size:12px;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:14px;margin-bottom:14px}
.bubble textarea{width:100%;border:0;background:transparent;resize:none;font-family:var(--f-body);font-size:12px;line-height:1.5;min-height:200px;padding:0}
.hint{font-size:11px;color:var(--muted);margin:6px 0 0}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-width:540px;margin:0 auto;border-radius:22px 22px 0 0;max-height:94%;overflow:auto;padding-top:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.sh-head h2{font-family:var(--f-display);font-size:28px;line-height:1.05;margin:0;text-wrap:balance}
.sh-head p{margin:4px 0 0;color:var(--muted);font-size:12px}
.x{border:0;background:var(--sunk);border-radius:999px;width:44px;height:44px;font-size:22px;flex:none}
.sh-foot{position:sticky;bottom:0;background:var(--bg);padding-top:10px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 14px;margin-bottom:12px}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step label{font-weight:600;font-size:13px;min-width:0}
.stp{display:flex;align-items:center;gap:6px;flex:none}
.sbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);font-size:20px;font-weight:600;line-height:1}
.sbtn.ten{width:auto;padding:0 10px;font-size:14px}
.stp input{width:60px;height:44px;text-align:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-family:var(--f-display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
/* Masraf satırı ve kasa özeti */
#expRows:empty{display:none}
.erow{display:grid;grid-template-columns:minmax(0,1fr) 96px 44px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.erow:last-child{border-bottom:0}
.erow input{width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;font-size:13px}
.erow input[type=number]{text-align:right;font-family:var(--f-display);font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.kasa{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px}
.kasa div{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:baseline}
.kasa div:last-child{border-bottom:0}
.kasa b{font-family:var(--f-display);font-size:16px;font-variant-numeric:tabular-nums}
.kasa .net{background:var(--wheat-soft);border-radius:0 0 var(--r) var(--r)}
.kasa .net b{font-size:20px}
/* Araç yükleme satırı: çeşit adı + adet */
.lrow{display:grid;grid-template-columns:minmax(0,1fr) 88px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lname{width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;font-size:13px;font-weight:600}
/* Sade sayı kutusu (± butonsuz) */
.qty{width:88px;height:44px;text-align:center;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-family:var(--f-display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;-moz-appearance:textfield;flex:none}
.qty::placeholder{font-family:var(--f-body);font-size:11px;font-weight:500;color:var(--muted)}
.qty::-webkit-outer-spin-button,.qty::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.lrow .qty{width:100%}
.stock{font-family:var(--f-body);font-size:11px;font-weight:600;color:var(--muted);margin-left:8px;background:var(--sunk);border-radius:999px;padding:2px 8px}
.phrow{display:flex;gap:8px;align-items:stretch}
.phrow input{flex:1;min-width:0}
.btn.pick{min-height:0;white-space:nowrap;padding:8px 12px}
/* Satış satırı: ürün adı + Taze / Bayat / İade kutuları */
.prod{padding:12px 0;border-bottom:1px solid var(--line)}
.prod:last-child{border-bottom:0}
.pname{font-weight:700;font-size:15px;margin-bottom:8px}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tc{display:grid;gap:4px;min-width:0}
.tc label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center}
.tc.k-taze label{color:var(--ok)}
.tc.k-bayat label{color:var(--warn)}
.tc input{width:100%;height:46px;text-align:center;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-family:var(--f-display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.tc.k-taze input{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.tc.k-bayat input{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.tc input::-webkit-outer-spin-button,.tc input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pm{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.pm button{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);font-size:20px;font-weight:600;line-height:1}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label,.flabel{font-weight:600;font-size:12px}
.field input[type=text],.field input[type=tel],.field input[type=time],.field input:not([type]),.field textarea,.cashin{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;font-size:13px}
.field textarea{min-height:150px;line-height:1.5}
.cashin{font-family:var(--f-display);font-size:20px;font-weight:700}
.check{display:flex;gap:12px;align-items:center;padding:10px 0;font-size:12px}
.check input{width:24px;height:24px;accent-color:var(--wheat)}
.err{color:var(--warn);font-weight:600;font-size:12px;min-height:1px}
.pills{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.pills .btn{flex:1 1 120px;min-height:44px;font-size:12px}
.prev{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px}
.prev div{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:12px;align-items:center}
.prev div:last-child{border-bottom:0}

.set{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.set .field:last-child{margin-bottom:0}
.prow{display:flex;gap:8px;align-items:center;padding:6px 0}
.prow input[type=text]{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;font-size:13px}
.prow label{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted);white-space:nowrap}
.prow input[type=checkbox]{width:22px;height:22px;accent-color:var(--wheat)}
.mrow{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.mrow .nm small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.mrow.pasif .nm{color:var(--muted)}
.ib{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);font-size:18px}
.ib:disabled{opacity:.35}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--toast-bg);color:var(--toast-fg);border-radius:14px;padding:12px 16px;display:flex;gap:16px;align-items:center;font-size:12px;max-width:calc(100% - 32px);width:max-content;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast button{background:none;border:0;color:var(--wheat);font-weight:700;font-size:12px;padding:6px 2px;min-height:40px}
.wz-prog{display:flex;gap:6px;margin:6px 0 18px}
.wz-prog i{flex:1;height:6px;border-radius:9px;background:var(--line)}
.wz-prog i.on{background:var(--wheat)}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>

<script>
/* ===== Dağıtım Günlüğü — veriler yalnızca bu telefonda tutulur (bkz. docs/adr/0001). ===== */
const KEY='ekmekDefteri.v1';
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,'0');
const hm=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
const dmy=ts=>{const d=new Date(ts);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()};
const dur=(a,b)=>{const m=Math.max(0,Math.round((b-a)/60000));return Math.floor(m/60)+'s '+(m%60)+'dk'};
const tl=n=>Number(n||0).toLocaleString('tr-TR')+' ₺';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>dmy(Date.now());
const ST={bekliyor:'Bekliyor',teslim:'Teslim edildi',kapali:'Kapalı',ugranmadi:'Uğranmadı'};
const DAY=864e5;

let S=null;
let ui={view:'home',sheet:null,summaryId:null,short:false,wz:null};
let undoSnap=null,toastTimer=null;

function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---- yardımcılar ---- */
const P=id=>S.products.find(p=>p.id===id);
const C=id=>S.customers.find(c=>c.id===id);
const active=()=>S.shifts.find(s=>s.id===S.activeId)||null;
const shiftById=id=>S.shifts.find(s=>s.id===id);
function statusOf(sh,cid){
  if(sh.deliveries.some(d=>d.cid===cid))return'teslim';
  return sh.statuses[cid]||(sh.end?'ugranmadi':'bekliyor');
}
function sumItems(list){const t={};list.forEach(it=>{for(const k in it)t[k]=(t[k]||0)+(+it[k]||0)});return t}
function itemsText(t,sep=', '){return S.products.filter(p=>t[p.id]).map(p=>p.name+' '+t[p.id]).join(sep)}
function loaded(sh){return sumItems(sh.loads.map(l=>l.items))}
/* Her teslimatta ürün başına üç sayı tutulur ({ürünId: adet}):
   items = verilen taze, bayat = verilen bayat, iade = bayiden geri alınan (taze ya da bayat). */
function bayatSum(list){return sumItems(list.map(d=>d.bayat||{}))}
function iadeSum(list){return sumItems(list.map(d=>d.iade||{}))}
function total(o){return Object.values(o||{}).reduce((a,b)=>a+(+b||0),0)}
/* Araçta kalan = yüklenen − taze verilen − bayat verilen + iade alınan (iade araca geri konur) */
function remaining(sh){const l=loaded(sh),d=sumItems(sh.deliveries.map(x=>x.items)),z=bayatSum(sh.deliveries),b=iadeSum(sh.deliveries),r={};for(const k in {...l,...b})r[k]=Math.max(0,(l[k]||0)-(d[k]||0)-(z[k]||0)+(b[k]||0));return r}
/* "Normal Ekmek 40 taze / 5 bayat / 3 iade · Pide 10 taze" */
function lineText(it,bz,ia){return S.products.filter(p=>it[p.id]||bz[p.id]||ia[p.id]).map(p=>{
  const parts=[];if(it[p.id])parts.push(it[p.id]+' taze');if(bz[p.id])parts.push(bz[p.id]+' bayat');if(ia[p.id])parts.push(ia[p.id]+' iade');
  return p.name+' '+parts.join(' / ');}).join(' · ')}
function groups(sh){
  const m={};sh.deliveries.forEach(d=>{(m[d.cid]=m[d.cid]||[]).push(d)});
  return Object.keys(m).map(cid=>({cid,list:m[cid].sort((a,b)=>a.ts-b.ts)})).sort((a,b)=>a.list[0].ts-b.list[0].ts);
}
function cashOf(list){return list.reduce((s,d)=>s+(d.cash>0?d.cash:0),0)}

/* ---- rapor metni ---- */
/* Rapor sırası: başlık → araç yüklemeleri → teslimatlar (her teslimat ayrı satır, saat sırasıyla)
   → uğranmayanlar → verilen / iade / araçta kalan → en sonda masraflar ve kasaya teslim edilecek tutar. */
function report(sh,short){
  const st=S.settings,L=[];
  L.push(`🍞 *${st.header||'Dağıtım Raporu'} – ${dmy(sh.start)}*`);
  L.push(`👤 ${st.name||'Dağıtımcı'} | ⏰ Başlangıç ${hm(sh.start)}`);
  const G=groups(sh);
  const dels=sh.deliveries.slice().sort((a,b)=>a.ts-b.ts);
  const missing=sh.cids.filter(cid=>statusOf(sh,cid)!=='teslim');
  const taze=sumItems(sh.deliveries.map(d=>d.items));
  const bayat=bayatSum(sh.deliveries);
  const iade=iadeSum(sh.deliveries);
  const cash=cashOf(sh.deliveries);
  const cashN=G.filter(g=>cashOf(g.list)>0).length;
  const noPay=G.filter(g=>C(g.cid).daily&&cashOf(g.list)===0);

  // 1) Araç yüklemeleri
  L.push('',`🚚 *Araç yüklemeleri* (${sh.loads.length})`);
  if(!sh.loads.length)L.push('Yükleme girilmedi');
  sh.loads.slice().sort((a,b)=>a.ts-b.ts).forEach((l,i)=>L.push(`${i+1}. ${hm(l.ts)} – ${itemsText(l.items,' · ')}`));
  if(sh.loads.length>1)L.push('Toplam yüklenen: '+itemsText(loaded(sh),' · '));

  // 2) Teslimatlar
  if(!short){
    L.push('','✅ *Teslimatlar*');
    if(!dels.length)L.push('Teslimat yok.');
    const seen={};
    dels.forEach((d,i)=>{
      const c=C(d.cid);seen[d.cid]=(seen[d.cid]||0)+1;
      const custCash=cashOf(sh.deliveries.filter(x=>x.cid===d.cid));
      let line=`${i+1}. ${hm(d.ts)} ${c.name}${seen[d.cid]>1?` (${seen[d.cid]}. teslimat)`:''} – ${lineText(d.items||{},d.bayat||{},d.iade||{})||'Sadece tahsilat'}`;
      if(d.cash>0)line+=` | 💵 ${tl(d.cash)}`;else if(c.daily&&custCash===0)line+=' | ⚠️ Tahsilat yok';
      if(d.note)line+=` – _${d.note}_`;
      L.push(line);
    });
    if(missing.length){
      L.push('','🚫 *Uğranmadı / Kapalı*');
      missing.forEach(cid=>L.push(`- ${C(cid).name} (${ST[statusOf(sh,cid)]})`));
    }
  }else{
    L.push('',`✅ Teslim edilen: ${G.length}/${sh.cids.length} bayi (${dels.length} teslimat)`);
    if(missing.length)L.push(`Uğranmadı / Kapalı: ${missing.length} bayi`);
  }

  // 3) Toplamlar
  L.push('',`📦 *Verilen* (taze ${total(taze)}, bayat ${total(bayat)})`);
  const given=S.products.filter(p=>taze[p.id]||bayat[p.id]).map(p=>{
    const parts=[];if(taze[p.id])parts.push(taze[p.id]+' taze');if(bayat[p.id])parts.push(bayat[p.id]+' bayat');
    return`${p.name}: ${parts.join(' · ')}`;});
  L.push(...(given.length?given:['Teslimat yok']));
  const iadeP=S.products.filter(p=>iade[p.id]);
  L.push('',`↩️ *İade* (${iadeP.length} çeşit, toplam ${total(iade)})`);
  L.push(...(iadeP.length?iadeP.map(p=>`${p.name}: ${iade[p.id]}`):['İade alınmadı']));
  if(sh.loads.length)L.push('','🚚 Araçta kalan: '+(itemsText(sh.leftover||remaining(sh),' · ')||'0'));

  // 4) En sonda: masraflar ve kasaya teslim edilecek tutar
  const ex=sh.expenses||[],exT=ex.reduce((s,e)=>s+(e.amount||0),0);
  L.push('','💰 *Kasa*');
  L.push(`Toplanan nakit: ${tl(cash)} (${cashN} bayi)`);
  if(noPay.length)L.push(`⚠️ Tahsilat yok: ${noPay.map(g=>C(g.cid).name).join(', ')}`);
  L.push(`Masraflar: ${tl(exT)}`);
  ex.forEach(e=>L.push(`- ${e.desc}: ${tl(e.amount)}`));
  L.push(`*Kasaya teslim (kalan tutar): ${tl(cash-exT)}*`);
  return L.join('\n');
}
function waNum(p){let d=String(p||'').replace(/\D/g,'');if(!d)return'';if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('0'))d='90'+d.slice(1);if(d.length===10&&d[0]==='5')d='90'+d;return d}

  <div class="set"><p class="hint" style="margin:0 0 10px">Veriler yalnızca bu telefonda durur. Telefon değişirse yedekten yükleyin.</p>
    <div class="row-actions" style="margin:0"><button class="btn wide" data-act="backupcopy">Yedeği kopyala</button>

    <button class="btn wide" data-act="restore">Yedekten yükle</button></div></div>
  <div class="sec">Sıfırla</div>

}
function vWizard(){
  const w=ui.wz,steps=3;
  let body='';
  if(w.step===1)body=`<div class="field"><label for="wz_f">Adınız</label><input id="wz_f" type="text" value="${esc(w.name)}" placeholder="Örn. Ahmet"><p class="hint">Raporun başında görünür.</p></div>`;
  if(w.step===2)body=`<div class="field"><label for="wz_f">Rapor yollanacak adres (WhatsApp numarası)</label><div class="phrow"><input id="wz_f" type="tel" inputmode="tel" value="${esc(w.phone)}" placeholder="0532 123 45 67">${pickBtn('wz_f')}</div><p class="hint">Rapor bu numaraya gider. Bir gruba gönderecekseniz boş bırakın; WhatsApp'ta grubu siz seçersiniz.</p></div>`;
  if(w.step===3)body=`<div class="field"><label for="wz_f">Bayiler (her satıra bir bayi, gidiş sırasıyla)</label><textarea id="wz_f" placeholder="Yıldız Market&#10;Çınar Bakkal&#10;Güneş Lokanta">${esc(w.customers)}</textarea><p class="hint">Ekmek çeşitlerini her mesaide araç yüklemesinde yazarsınız. Standart adet ve günlük tahsilat bilgisini sonra Ayarlar'dan eklersiniz.</p></div>`;
  return`<header class="top"><div class="brand">${logo}Dağıtım Günlüğü</div><button class="link" data-act="wzdone">Kurulumu atla</button></header>
  <div class="wz-prog">${Array.from({length:steps},(_,i)=>`<i class="${i<w.step?'on':''}"></i>`).join('')}</div>
  <section class="hero"><h1>${['Hoş geldiniz','Rapor kime gidecek?','Hangi dükkânlara gidiyorsunuz?'][w.step-1]}</h1><p>Adım ${w.step}/${steps}</p></section>
  ${body}
  <div class="bar"><div style="display:flex;gap:10px">${w.step>1?`<button class="btn" style="flex:0 0 30%" data-act="wz" data-d="-1">Geri</button>`:''}<button class="big" data-act="wz" data-d="1">${w.step<steps?'İleri':'Bitir'}</button></div></div>`;
}

/* ---- alt sayfalar (sheet) ---- */
function sheetWrap(title,sub,body,foot){
  return`<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
  <div class="grab"></div><div class="sh-head"><div><h2>${esc(title)}</h2>${sub?`<p>${sub}</p>`:''}</div><button class="x" data-act="close" aria-label="Kapat">×</button></div>
  ${body}${foot?`<div class="sh-foot">${foot}</div>`:'<div style="height:16px"></div>'}</div></div>`;
}
function vSheet(){
  const s=ui.sheet,sh=active();
  if(s.t==='cust'){
    const c=C(s.cid),mine=sh.deliveries.filter(d=>d.cid===s.cid).sort((a,b)=>a.ts-b.ts),st=statusOf(sh,s.cid);
    const edit=s.edit?mine.find(d=>d.id===s.edit):null;
    const showForm=edit||!mine.length||s.extra;
    let body='';
    if(!showForm){
      body+=`<div class="prev">${mine.map(d=>`<div><span><b class="num">${hm(d.ts)}</b> · ${lineText(d.items,d.bayat||{},d.iade||{})||'—'}${d.cash?` · ${tl(d.cash)}`:''}${d.note?`<br><small>${esc(d.note)}</small>`:''}</span><button class="link" data-act="editdel" data-cid="${s.cid}" data-id="${d.id}">Düzenle</button></div>`).join('')}</div>`;
      return sheetWrap(c.name,`${ST[st]} · ${mine.length} teslimat${c.note?' · '+esc(c.note):''}`,body,`<button class="big" data-act="extra" data-id="${s.cid}">+ Tekrar ekmek ver</button>`);
    }
    const base=edit?edit.items:(mine.length?{}:(c.std||{}));
    // Yalnızca bu mesaide araca yüklenmiş ve araçta hâlâ bulunan çeşitler gösterilir.
    // Düzenlenen teslimattaki adetler araçtaki sayıya geri eklenir; o teslimatta geçen çeşit her zaman görünür.
    const rem=remaining(sh),ld=loaded(sh);
    const inEdit=p=>!!(edit&&(edit.items[p.id]||(edit.bayat||{})[p.id]||(edit.iade||{})[p.id]));
    const avail=p=>Math.max(0,(rem[p.id]||0)+(edit?((edit.items[p.id]||0)+((edit.bayat||{})[p.id]||0)-((edit.iade||{})[p.id]||0)):0));
    const prods=S.products.filter(p=>inEdit(p)||((ld[p.id]||0)>0&&avail(p)>0));
    if(!prods.length)return sheetWrap(c.name,'',`<div class="alert"><span><b>${sh.loads.length?'Araçta ekmek kalmadı.':'Henüz araç yüklemesi yok.'}</b> ${sh.loads.length?'Yeni bir yükleme ekleyin.':'Önce araç yüklemesinde çeşitleri ve adetleri yazın.'}</span></div>`,`<button class="big" data-act="load">Araç yüklemesine git</button>`);
    if(!edit&&!mine.length)body+=`<div class="pills"><button class="btn" data-act="setst" data-cid="${s.cid}" data-s="kapali" ${st==='kapali'?'aria-pressed="true"':''}>Kapalıydı</button><button class="btn" data-act="setst" data-cid="${s.cid}" data-s="ugranmadi">Uğranmadı</button>${st!=='bekliyor'?`<button class="btn" data-act="clrst" data-cid="${s.cid}">Bekliyor'a al</button>`:''}</div>`;
    body+=`<div id="custForm" data-std='${esc(JSON.stringify(edit||mine.length?{}:(c.std||{})))}'>`;
    body+=`<div class="card">${prods.map(p=>saleRow(p,base[p.id],edit?(edit.bayat||{})[p.id]:0,edit?(edit.iade||{})[p.id]:0,avail(p))).join('')}</div>`;
    const cashVal=edit&&edit.cash!=null?edit.cash:'';
    const cashOpen=c.daily||(edit&&edit.cash>0);
    body+=`<div id="cashBox" class="field" ${cashOpen?'':'hidden'}><label for="q_cash">Alınan nakit (₺)</label><input id="q_cash" class="cashin" type="number" inputmode="numeric" min="0" step="1" value="${cashVal}" placeholder="0">${c.daily?'<p class="hint">Boş kalırsa raporda "⚠️ Tahsilat yok" yazar.</p>':''}</div>`;
    if(!cashOpen)body+=`<button class="link" id="cashAdd" data-act="showcash">+ Tahsilat ekle</button>`;
    body+=`<div class="field"><label for="q_note">Not (isteğe bağlı)</label><input id="q_note" type="text" value="${esc(edit?edit.note:'')}" placeholder="Örn. kapıya bırakıldı"></div>`;
    body+=`<p class="err" id="q_err"></p></div>`;
    if(edit)body+=`<button class="btn danger" style="width:100%;margin-bottom:8px" data-act="deldel" data-id="${edit.id}">Bu teslimatı sil</button>`;
    const sub=[mine.length&&!edit?`${mine.length+1}. teslimat`:'',c.note?esc(c.note):(c.daily?'💵 Günlük tahsilatlı bayi':'')].filter(Boolean).join(' · ');
    return sheetWrap(c.name,sub,body,`<button class="big" id="saveBtn" data-act="savedel">Kaydet</button>`);
  }
  if(s.t==='load'){
    const act=S.products.filter(p=>p.active);
    const prev=sh.loads.length?`<div class="flabel" style="margin-bottom:6px">Bu mesaideki yüklemeler</div><div class="prev">${sh.loads.slice().sort((a,b)=>a.ts-b.ts).map((l,i)=>`<div><span><b class="num">${i+1}. ${hm(l.ts)}</b> · ${itemsText(l.items,' · ')}</span></div>`).join('')}</div>`:'';
    const rows=(act.length?act.map(p=>loadRow(p.id,p.name,p.id)):[loadRow(newKey(),'','')]).join('');
    return sheetWrap('Araç yüklemesi','Çeşit adlarını buradan düzeltebilir, yeni çeşit ekleyebilirsiniz.',
      `${prev}<div class="card" id="loadRows">${rows}</div>
      <button class="link" data-act="addloadrow">+ Yeni çeşit ekle</button><p class="err" id="q_err"></p>`,
      `<button class="big" data-act="saveload">Yüklemeyi kaydet</button>${s.first?'<button class="btn" data-act="close">Şimdilik atla</button>':''}`);
  }
  if(s.t==='newcust'||s.t==='editcust'){
    const c=s.t==='editcust'?C(s.id):{name:'',phone:'',note:'',std:{},daily:false,active:true};
    const full=s.t==='editcust'||s.full;
    let body=`<div class="field"><label for="n_name">Bayi adı</label><input id="n_name" type="text" value="${esc(c.name)}" placeholder="Örn. Yıldız Market"></div>
    <label class="check"><input id="n_daily" type="checkbox" ${c.daily?'checked':''}> Günlük nakit tahsilat yapılır</label>`;
    if(full){
      body+=`<div class="field"><label for="n_phone">Telefon</label><input id="n_phone" type="tel" inputmode="tel" value="${esc(c.phone)}"></div>
      <div class="field"><label for="n_note">Not</label><input id="n_note" type="text" value="${esc(c.note)}" placeholder="Örn. arka kapıdan"></div>
      <div class="flabel" style="margin-bottom:6px">Standart adet</div><div class="card">${S.products.filter(p=>p.active).map(p=>stepper('n_'+p.id,p.name,(c.std||{})[p.id])).join('')}</div>`;
      if(s.t==='editcust')body+=`<label class="check"><input id="n_active" type="checkbox" ${c.active?'checked':''}> Aktif (pasif bayi mesai listesine gelmez)</label>`;
    }
    body+=`<p class="err" id="q_err"></p>`;
    return sheetWrap(s.t==='editcust'?'Bayiyi düzenle':'Yeni bayi',s.t==='newcust'&&!full?'Bugünkü listenin sonuna eklenir':'',body,`<button class="big" data-act="savecust">${s.t==='editcust'?'Kaydet':'Ekle'}</button>`);
  }
  if(s.t==='finish'){
    const pend=sh.cids.filter(c=>statusOf(sh,c)==='bekliyor').length;
    let body='';
    if(!sh.deliveries.length)body+=`<div class="alert"><span><b>Hiç teslimat girilmedi.</b> Yine de bitirebilirsiniz.</span></div>`;
    if(pend)body+=`<div class="alert"><span><b>${pend} bayi işaretlenmedi.</b> Bitirince "Uğranmadı" sayılacaklar.</span></div>`;
    if(sh.loads.length){const r=remaining(sh);
      body+=`<div class="flabel">Araçta kalan</div><p class="hint" style="margin:0 0 8px">Hesaplanan değer. Gerekirse düzeltin.</p><div class="card">${S.products.filter(p=>p.id in r).map(p=>stepper('r_'+p.id,p.name,r[p.id])).join('')}</div>`;}
    // Masraflar: toplanan nakitten düşülür, kalan kasaya teslim edilir
    const ex=(sh.expenses||[]);
    body+=`<div class="flabel" style="margin-top:4px">Masraflar</div><p class="hint" style="margin:0 0 8px">Gün içinde nakitten yaptığınız harcamalar. Toplanan paradan düşülür.</p>
    <div class="card" id="expRows">${(ex.length?ex:[]).map(e=>expRow(newKey(),e.desc,e.amount)).join('')}</div>
    <button class="btn" style="width:100%;margin-bottom:12px" data-act="addexp" data-d="">+ Masraf ekle</button>
    <div class="kasa" id="kasaBox"></div><p class="err" id="q_err"></p>`;
    return sheetWrap('Mesaiyi bitir','Masrafları girin ve onaylayın',body,`<button class="big dark" data-act="dofinish">Evet, mesaiyi bitir</button><button class="btn" data-act="close">Vazgeç</button>`);
  }
  if(s.t==='sttime'){
    return sheetWrap('Başlangıç saati','Yanlış saatte bastıysanız düzeltin',`<div class="field"><label for="t_start">Saat</label><input id="t_start" type="time" value="${hm(sh.start)}"></div>`,`<button class="big" data-act="savesttime">Kaydet</button>`);
  }
  if(s.t==='stale'){
    return sheetWrap('Açık kalan mesai',`${dmy(sh.start)} ${hm(sh.start)} saatinde başlayan mesai hâlâ açık.`,`<p style="margin:0">Bitirilsin mi?</p>`,`<button class="big dark" data-act="finish">Mesaiyi bitir</button><button class="btn" data-act="close">Devam et</button>`);
  }
  if(s.t==='bulk'){
    return sheetWrap('Toplu bayi ekle','Her satıra bir bayi, gidiş sırasıyla',`<div class="field"><label for="b_txt">Bayiler</label><textarea id="b_txt" placeholder="Yıldız Market&#10;Çınar Bakkal"></textarea></div><p class="err" id="q_err"></p>`,`<button class="big" data-act="savebulk">Listeye ekle</button>`);
  }
  if(s.t==='restore'){
    return sheetWrap('Yedekten yükle','Mevcut veriler yedektekilerle değişir',`<div class="field"><label for="r_file">Yedek dosyası</label><input id="r_file" type="file" accept=".json,.txt,application/json,text/plain"></div><div class="field"><label for="r_txt">ya da yedek metnini yapıştırın</label><textarea id="r_txt"></textarea></div><p class="err" id="q_err"></p>`,`<button class="big" data-act="dorestore">Yedeği yükle</button>`);
  }
  if(s.t==='reset'){
    return sheetWrap('Tüm verileri sil?','Bayiler, ekmek çeşitleri ve mesai geçmişi silinir. Geri alınamaz.',`<p style="margin:0">Önce yedek almak isterseniz Ayarlar → Yedek bölümünü kullanın.</p>`,`<button class="big dark" data-act="doreset">Sil ve kurulumu başlat</button><button class="btn" data-act="close">Vazgeç</button>`);
  }
  return'';
}

/* ---- çizim ---- */
function render(){
  let h;
  if(ui.view==='wizard')h=vWizard();
  else if(ui.view==='settings')h=vSettings();
  else if(ui.view==='summary')h=vSummary();
  else if(ui.view==='history')h=vHistory();
  else h=active()?vShift():vHome();
  $('app').innerHTML=h;
  syncGuard();
  const sw=$('sheet');
  if(ui.sheet&&(active()||!['cust','load','finish','sttime','stale'].includes(ui.sheet.t))){sw.innerHTML=vSheet();sw.hidden=false;updSaveLabel();updKasa()}
  else{ui.sheet=null;sw.innerHTML='';sw.hidden=true}
  document.body.style.overflow=ui.sheet?'hidden':'';
}
function renderToast(){
  const t=$('toast');
  if(!ui.toast){t.hidden=true;t.innerHTML='';return}
  t.hidden=false;t.innerHTML=`<div class="toast" role="status"><span>${esc(ui.toast.msg)}</span>${ui.toast.undo?'<button data-act="undo">Geri al</button>':''}</div>`;
}
function toast(msg,undo){
  ui.toast={msg,undo:!!undo};renderToast();clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ui.toast=null;if(undo)undoSnap=null;renderToast()},undo?5000:2400);
}
function snap(){undoSnap=JSON.stringify(S)}
function openSheet(s){ui.sheet=s;render();const f=document.querySelector('.sheet');if(f)f.scrollTop=0}
function closeSheet(){ui.sheet=null;render()}
function err(m){const e=$('q_err');if(e)e.textContent=m}
function updSaveLabel(){
  const f=$('custForm'),b=$('saveBtn');if(!f||!b)return;
  let std={};try{std=JSON.parse(f.dataset.std||'{}')}catch(e){}
  const keys=Object.keys(std).filter(k=>std[k]);
  const val=id=>{const el=$(id);return el?(+el.value||0):0};
  const same=keys.length&&S.products.every(p=>val('q_'+p.id)===(+std[p.id]||0)&&!val('z_'+p.id)&&!val('i_'+p.id));
  b.textContent=same?'Standart teslim et':'Kaydet';
}
function nameTaken(name,exceptId){const n=name.toLocaleLowerCase('tr');return S.customers.some(c=>c.id!==exceptId&&c.name.toLocaleLowerCase('tr')===n)}
function copyText(t,fallbackId){
  const done=()=>toast('Kopyalandı');
  const fb=()=>{const el=fallbackId&&$(fallbackId);if(el){el.focus();el.select()}toast('Metin seçildi, uzun basıp kopyalayın')};
  try{navigator.clipboard.writeText(t).then(done,fb)}catch(e){fb()}
}
function buildState(w){
  const lines=s=>String(s||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const products=[]; // çeşitler araç yüklemesinde girilir
  const seen=new Set();const customers=[];
  lines(w.customers).forEach(name=>{const k=name.toLocaleLowerCase('tr');if(seen.has(k))return;seen.add(k);customers.push({id:'c'+uid(),name,phone:'',note:'',std:{},daily:false,active:true})});
  return{v:3,sample:false,settings:{name:w.name||'',phone:w.phone||'',header:'Dağıtım Raporu',startMsg:false},products,customers,shifts:[],activeId:null};
}
function wzRead(){const f=$('wz_f');if(!f)return;const k=['name','phone','customers'][ui.wz.step-1];ui.wz[k]=f.value.trim()}

/* ---- eylemler ---- */
const A={
  go:d=>{ui.view=d.v;ui.sheet=null;render();window.scrollTo(0,0)},
  start:()=>{
    const sh={id:uid(),start:Date.now(),end:null,cids:S.customers.filter(c=>c.active).map(c=>c.id),loads:[],deliveries:[],statuses:{},leftover:null,sent:false,startSent:false};
    S.shifts.push(sh);S.activeId=sh.id;save();ui.view='home';window.scrollTo(0,0);
    openSheet({t:'load',first:true});toast('Mesai başladı · '+hm(sh.start));
  },
  cust:d=>openSheet({t:'cust',cid:d.id}),
  extra:d=>openSheet({t:'cust',cid:d.id,extra:true}),
  editdel:d=>openSheet({t:'cust',cid:d.cid,edit:d.id}),
  inc:d=>{const e=$(d.for);e.value=(parseInt(e.value,10)||0)+1;updSaveLabel()},
  inc10:d=>{const e=$(d.for);e.value=(parseInt(e.value,10)||0)+10;updSaveLabel()},
  dec:d=>{const e=$(d.for);e.value=Math.max(0,(parseInt(e.value,10)||0)-1);updSaveLabel()},
  showcash:()=>{$('cashBox').hidden=false;$('cashAdd').hidden=true;$('q_cash').focus()},
  savedel:()=>{
    const sh=active(),s=ui.sheet,c=C(s.cid);
    const edit=s.edit?sh.deliveries.find(d=>d.id===s.edit):null;
    const items={};S.products.forEach(p=>{const v=nv('q_'+p.id);if(v)items[p.id]=v});
    const bayat={};S.products.forEach(p=>{const v=nv('z_'+p.id);if(v)bayat[p.id]=v});
    const iade={};S.products.forEach(p=>{const v=nv('i_'+p.id);if(v)iade[p.id]=v});
    const ce=$('q_cash'),cb=$('cashBox');
    const cash=ce&&cb&&!cb.hidden&&ce.value!==''?Math.max(0,parseInt(ce.value,10)||0):null;
    const note=$('q_note').value.trim();
    if(!Object.keys(items).length&&!total(bayat)&&!total(iade)&&!cash){err('En az bir taze, bayat, iade adedi ya da tahsilat girin.');return}
    snap();
    if(edit)Object.assign(edit,{items,bayat,iade,cash,note});
    else sh.deliveries.push({id:uid(),cid:s.cid,ts:Date.now(),items,bayat,iade,cash,note});
    delete sh.statuses[s.cid];save();ui.sheet=null;render();
    toast(`${c.name}: ${edit?'güncellendi':'teslim edildi'}`,true);
  },
  setst:d=>{snap();active().statuses[d.cid]=d.s;save();ui.sheet=null;render();toast(`${C(d.cid).name}: ${ST[d.s]}`,true)},
  clrst:d=>{delete active().statuses[d.cid];save();openSheet({t:'cust',cid:d.cid})},
  deldel:d=>{snap();const sh=active();sh.deliveries=sh.deliveries.filter(x=>x.id!==d.id);save();ui.sheet=null;render();toast('Teslimat silindi',true)},
  load:()=>openSheet({t:'load'}),
  addloadrow:()=>{const box=$('loadRows'),k=newKey();box.insertAdjacentHTML('beforeend',loadRow(k,'',''));$('ln_'+k).focus()},
  saveload:()=>{
    const rows=[...document.querySelectorAll('#loadRows .lrow')],seen=new Set(),plan=[];
    for(const r of rows){
      const k=r.dataset.key,name=$('ln_'+k).value.trim(),qty=nv('l_'+k);
      if(!name){if(qty){err('Adet girdiğiniz her çeşidin adını yazın.');return}continue}
      const low=name.toLocaleLowerCase('tr');
      if(seen.has(low)){err(`"${name}" iki kez yazılmış.`);return}
      seen.add(low);plan.push({pid:r.dataset.pid,name,qty});
    }
    if(!plan.length){err('En az bir çeşit adı yazın.');return}
    snap();
    const items={};
    plan.forEach(x=>{
      let p=x.pid?P(x.pid):S.products.find(q=>q.name.toLocaleLowerCase('tr')===x.name.toLocaleLowerCase('tr'));
      if(!p){p={id:'p'+uid(),name:x.name,active:true};S.products.push(p)}else{p.name=x.name;p.active=true}
      if(x.qty)items[p.id]=x.qty;
    });
    const n=Object.keys(items).length;
    if(n)active().loads.push({ts:Date.now(),items});
    save();ui.sheet=null;render();toast(n?'Yükleme kaydedildi':'Çeşit adları güncellendi',true);
  },
  newcust:()=>openSheet({t:'newcust'}),
  addcust:()=>openSheet({t:'newcust',full:true}),
  editcust:d=>openSheet({t:'editcust',id:d.id}),
  savecust:()=>{
    const s=ui.sheet,name=$('n_name').value.trim();
    if(!name){err('Bayi adı girin.');return}
    if(nameTaken(name,s.id)){err('Bu isimde bir bayi zaten var. Ayırt edici bir ad yazın (örn. "'+name+' 2").');return}
    const full=s.t==='editcust'||s.full;
    const c=s.t==='editcust'?C(s.id):{id:'c'+uid(),name,phone:'',note:'',std:{},daily:false,active:true};
    c.name=name;c.daily=$('n_daily').checked;
    if(full){c.phone=$('n_phone').value.trim();c.note=$('n_note').value.trim();
      const std={};S.products.forEach(p=>{const v=nv('n_'+p.id);if(v)std[p.id]=v});c.std=std;
      if($('n_active'))c.active=$('n_active').checked;}
    if(s.t!=='editcust'){S.customers.push(c);const sh=active();if(sh&&ui.view!=='settings')sh.cids.push(c.id)}
    save();
    if(s.t==='newcust'&&!s.full&&active()&&ui.view!=='settings'){openSheet({t:'cust',cid:c.id});toast(name+' listeye eklendi')}
    else{ui.sheet=null;render();toast('Kaydedildi')}
  },
  mv:d=>{const i=+d.i,j=i+(+d.d);const a=S.customers;[a[i],a[j]]=[a[j],a[i]];save();render()},
  bulk:()=>openSheet({t:'bulk'}),
  savebulk:()=>{const lines=$('b_txt').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
    if(!lines.length){err('En az bir satır yazın.');return}
    let add=0,dup=0;lines.forEach(name=>{if(nameTaken(name)){dup++;return}S.customers.push({id:'c'+uid(),name,phone:'',note:'',std:{},daily:false,active:true});add++});
    save();ui.sheet=null;render();toast(`${add} bayi eklendi${dup?`, ${dup} tanesi zaten vardı`:''}`)},
  addprod:()=>{const v=$('newprod').value.trim();if(!v)return;S.products.push({id:'p'+uid(),name:v,active:true});save();render();toast(v+' eklendi')},
  finish:()=>openSheet({t:'finish'}),
  pickcontact:d=>{
    let p;try{p=navigator.contacts.select(['name','tel'],{multiple:false})}catch(e){toast('Rehber açılamadı');return}
    p.then(list=>{
      if(!list||!list.length)return;
      const tel=(list[0].tel||[]).find(Boolean),name=(list[0].name||[]).find(Boolean);
      if(!tel){toast((name||'Seçilen kişi')+': telefon numarası yok');return}
      const el=$(d.for);if(!el)return;el.value=tel.trim();
      if(el.dataset.set){S.settings.phone=el.value;save()}
      toast((name?name+' · ':'')+el.value+' seçildi');
    }).catch(()=>toast('Rehber açılamadı'));
  },
  addexp:d=>{const k=newKey();$('expRows').insertAdjacentHTML('beforeend',expRow(k,d.d,''));(d.d?$('ea_'+k):$('ed_'+k)).focus();updKasa()},
  delexp:d=>{const r=document.querySelector(`#expRows .erow[data-key="${d.key}"]`);if(r)r.remove();updKasa()},
  dofinish:()=>{
    const sh=active();
    sh.expenses=readExp();
    if(sh.loads.length){const lo={};S.products.forEach(p=>{if($('r_'+p.id))lo[p.id]=nv('r_'+p.id)});sh.leftover=lo}
    sh.end=Date.now();S.activeId=null;save();
    undoSnap=null;clearTimeout(toastTimer);ui.toast=null;renderToast();
    ui.sheet=null;ui.view='summary';ui.summaryId=sh.id;ui.short=false;render();window.scrollTo(0,0);
  },
  cancelshift:()=>{snap();const sh=active();S.shifts=S.shifts.filter(s=>s.id!==sh.id);S.activeId=null;save();render();toast('Mesai iptal edildi',true)},
  sttime:()=>openSheet({t:'sttime'}),
  savesttime:()=>{const v=$('t_start').value;if(!v)return;const sh=active(),[h,m]=v.split(':').map(Number),d=new Date(sh.start);d.setHours(h,m,0,0);
    if(d.getTime()>Date.now()){toast('Başlangıç saati ileride olamaz');return}
    sh.start=d.getTime();save();ui.sheet=null;render();toast('Başlangıç '+v+' yapıldı')},
  summary:d=>{ui.view='summary';ui.summaryId=d.id;ui.short=false;render();window.scrollTo(0,0)},
  mode:d=>{ui.short=d.m==='k';render()},
  sent:(d)=>{const sh=shiftById(d.id);if(sh){sh.sent=true;save();setTimeout(render,400)}return true},
  startsent:()=>{const sh=active();if(sh){sh.startSent=true;save();setTimeout(render,400)}return true},
  copy:()=>copyText($('msgText').value,'msgText'),
  reopen:()=>{const sh=shiftById(ui.summaryId);sh.end=null;sh.leftover=null;sh.sent=false;S.activeId=sh.id;save();ui.view='home';render();window.scrollTo(0,0);toast('Mesai yeniden açıldı')},
  undo:()=>{if(!undoSnap)return;S=JSON.parse(undoSnap);undoSnap=null;save();ui.sheet=null;render();toast('Geri alındı')},
  backupcopy:()=>copyText('EKMEK-DEFTERI-YEDEK\n'+JSON.stringify(S)),
  restore:()=>openSheet({t:'restore'}),
  dorestore:()=>{
    let t=$('r_txt').value.trim().replace(/^EKMEK-DEFTERI-YEDEK\s*/,'');
    try{const o=JSON.parse(t);if(!o||!Array.isArray(o.products)||!Array.isArray(o.customers)||!Array.isArray(o.shifts))throw 0;
      S=o;migrate();save();ui.sheet=null;ui.view='home';render();toast('Yedek yüklendi')}
    catch(e){err('Bu metin geçerli bir Dağıtım Günlüğü yedeği değil. Yedeğin tamamını yapıştırdığınızdan emin olun.')}
  },
  askreset:()=>openSheet({t:'reset'}),
  doreset:()=>{ui.sheet=null;ui.wz={step:1,name:'',phone:'',customers:''};ui.view='wizard';render();window.scrollTo(0,0)},
  wz:d=>{wzRead();const n=ui.wz.step+(+d.d);if(n<1)return;if(n>3){A.wzdone();return}ui.wz.step=n;render()},
  wzdone:()=>{wzRead();S=buildState(ui.wz);save();ui.wz=null;ui.view='home';render();window.scrollTo(0,0);toast('Kurulum tamamlandı')},
  close:()=>closeSheet(),
  scrim:(d,el,e)=>{if(e.target===el)closeSheet()},
};

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;if(!A[a])return;
  const keep=A[a](b.dataset,b,e);
  if(b.tagName==='A'&&keep!==true)e.preventDefault();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='search'){const q=t.value.trim().toLocaleLowerCase('tr');document.querySelectorAll('#clist .crow').forEach(r=>{r.hidden=q&&!r.dataset.name.includes(q)})}
  if(t.closest&&t.closest('#custForm'))updSaveLabel();
  if(t.closest&&t.closest('#expRows'))updKasa();
});
document.addEventListener('focusin',e=>{if(e.target.matches('.stp input,.cashin'))setTimeout(()=>e.target.select(),0)});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.set){const k=t.dataset.set;S.settings[k]=t.type==='checkbox'?t.checked:t.value.trim();save();toast('Kaydedildi')}
  if(t.dataset.pname){const p=P(t.dataset.pname),v=t.value.trim();if(v){p.name=v;save();toast('Kaydedildi')}else t.value=p.name}
  if(t.dataset.pact){P(t.dataset.pact).active=t.checked;save();render()}
  if(t.id==='r_file'&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>{$('r_txt').value=String(r.result||'')};r.readAsText(t.files[0])}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.sheet)closeSheet()});

/* ---- Android geri tuşu ----
   Alt sayfa açıkken veya ana ekran dışındayken geçmişte tek bir "koruma" kaydı tutulur.
   Geri tuşu bu kaydı tüketir: önce alt sayfa kapanır, sonra ana ekrana dönülür; ancak ana ekrandayken uygulamadan çıkılır. */
function nonRoot(){return !!ui.sheet||(ui.view==='wizard'?!!(ui.wz&&ui.wz.step>1):ui.view!=='home')}
function syncGuard(){if(nonRoot()&&!(history.state&&history.state.g))history.pushState({g:1},'')}
window.addEventListener('popstate',()=>{
  if(ui.sheet)ui.sheet=null;
  else if(ui.view==='wizard'){if(ui.wz&&ui.wz.step>1){wzRead();ui.wz.step--}}
  else if(ui.view!=='home')ui.view='home';
  render();
});

/* Eski kayıtları güncel biçime getirir.
   v1: iade tek sayıydı → teslimattaki ilk ürüne yazılır. v2: bayat alanı yoktu → boş eklenir
   (v2'de "bayat iade" diye girilen sayılar geri alınan ürün olduğu için iade olarak kalır). */
function migrate(){
  S.shifts.forEach(s=>s.deliveries.forEach(d=>{
    if(!(d.iade&&typeof d.iade==='object')){
      const n=+d.iade||0,pid=Object.keys(d.items||{})[0]||(S.products[0]&&S.products[0].id);
      d.iade=n&&pid?{[pid]:n}:{};
    }
    if(!(d.bayat&&typeof d.bayat==='object'))d.bayat={};
  }));
  delete S.settings.footer;
  S.v=3;
}

/* ---- açılış ---- */
function boot(){
  S=load();
  if(!S){
    S=buildState({});
    ui.wz={step:1,name:'',phone:'',customers:''};
    ui.view='wizard';
  }else{
    S.shifts=S.shifts.filter(s=>s.id===S.activeId||Date.now()-s.start<60*DAY);
    migrate();
    save();
  }
  render();
  const sh=active();if(sh&&ui.view==='home'&&Date.now()-sh.start>14*3600e3)openSheet({t:'stale'});
}
boot();

/* Tarayıcının verileri kendiliğinden silmemesi için kalıcı depolama iste */
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* Çevrimdışı çalışma */
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
